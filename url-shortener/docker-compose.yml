# Local/dev only. Credentials here are placeholders, not secrets.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_USER: urlshortener
      POSTGRES_PASSWORD: urlshortener
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urlshortener -d urlshortener"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/urlshortener
      DB_USERNAME: urlshortener
      DB_PASSWORD: urlshortener
      APP_BASE_URL: http://localhost:8080
    ports:
      - "8080:8080"
